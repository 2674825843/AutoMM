# prob03 robustness 实验矩阵（robustness_v001）
# 预注册判据在 computation 前固定（formulation_v002 §8.5 / parameters.yaml），此处仅映射到
# robustness 默认扰动约定并登记 computation 阶段实测值。R7（窗口敏感性）由本阶段只读探针补登。
# 版本：assumption_v001 / formulation_v002。
schema_version: 1
problem_id: 2025-cumcm-b
question_id: prob03
assumption_version: assumption_v001
formulation_version: formulation_v002
robustness_version: robustness_v001
seed: 20260830
baseline:
  main_t_hat_shared_um: 3.447668992836722
  t_hat_per_angle_um: [3.4507446594671896, 3.446258474301775]
  epsilon_12_percent: 0.13009085477863216
  n_sub_hat: 3.5576709414472134
  inv_band_cm1: [2000.0, 4000.0]
  polynomial_basis: centered_orthogonalized_chebyshev
  p_baseline_deg: 3
  q_envelope_deg: 1
  main_fit_weighted_rmse: 2.57e-3
  multibeam_decision_si: two_beam_negligible
  sic_mb_verdict: no_correction_needed
  result_dir: results/silicon_mb_verify
  sources:
