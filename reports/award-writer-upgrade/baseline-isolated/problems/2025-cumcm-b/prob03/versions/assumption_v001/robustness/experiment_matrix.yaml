    object: multibeam_necessary_conditions_si
    design: 界面反射率乘积/相干长度/界面平行度/吸收限制（Q1）
    status: PASS
    rule: N1 Rbar=0.01008<=theta_mb=0.05; N2 m_max_coh=439>=2; N3 alpha_bound≈0.0033°; N4 k≈0（m_max_abs=1e9）；全部满足
