# prob01 计算任务规格（computation 阶段由 Runner/resource-manager 提交）
# 本文件是 implementation 阶段的交付物之一：描述 computation 阶段应提交的唯一任务。
# 提交方式：Runner 使用 sys.executable 作为 command[0]（{python} 占位符），
# 通过 scripts/compute_dispatcher.py submit 调用 make_task_spec/submit_task；
# implementation 阶段禁止自行创建正式 task（tasks.py 也会拒绝 stage=implementation）。
#
# 提交等价命令：
#   python scripts/compute_dispatcher.py submit \
#     --problem-id 2025-cumcm-b --question-id prob01 --stage computation \
#     --code-path problems/2025-cumcm-b/prob01/versions/assumption_v001/code/compute.py \
#     --config-path problems/2025-cumcm-b/prob01/versions/assumption_v001/configs/task_config.yaml \
#     --input-path problems/2025-cumcm-b/prob01/versions/assumption_v001/formulations/formulation_v001/parameters.yaml \
#     --assumption-version assumption_v001 --formulation-version formulation_v001 \
#     --output-directory problems/2025-cumcm-b/prob01/versions/assumption_v001/results/synthetic_verify \
#     --working-directory . --timeout-seconds 120 --seed 20260829 \
#     -- {python} problems/2025-cumcm-b/prob01/versions/assumption_v001/code/compute.py \
#       --config problems/2025-cumcm-b/prob01/versions/assumption_v001/configs/task_config.yaml \
#       --input problems/2025-cumcm-b/prob01/versions/assumption_v001/formulations/formulation_v001/parameters.yaml \
#       --output problems/2025-cumcm-b/prob01/versions/assumption_v001/results/synthetic_verify
problem_id: 2025-cumcm-b
question_id: prob01
stage: computation
assumption_version: assumption_v001
formulation_version: formulation_v001
code_path: problems/2025-cumcm-b/prob01/versions/assumption_v001/code/compute.py
config_path: problems/2025-cumcm-b/prob01/versions/assumption_v001/configs/task_config.yaml
input_path: problems/2025-cumcm-b/prob01/versions/assumption_v001/formulations/formulation_v001/parameters.yaml
output_directory: problems/2025-cumcm-b/prob01/versions/assumption_v001/results/synthetic_verify
working_directory: .
timeout_seconds: 120
seed: 20260829
backend: local
command:
  - "{python}"
  - "problems/2025-cumcm-b/prob01/versions/assumption_v001/code/compute.py"
  - "--config"
  - "problems/2025-cumcm-b/prob01/versions/assumption_v001/configs/task_config.yaml"
  - "--input"
  - "problems/2025-cumcm-b/prob01/versions/assumption_v001/formulations/formulation_v001/parameters.yaml"
  - "--output"
  - "problems/2025-cumcm-b/prob01/versions/assumption_v001/results/synthetic_verify"
expected_outputs:
  - result.json
  - solver_status.json
  - verification.json
  - metadata.json
  - synthetic_spectrum_theta10.csv
  - synthetic_spectrum_theta15.csv
failure_conditions:
  - process 非零退出：code_runtime（先 compileall/ruff/探针复现，再考虑重试或修订）
  - result.json 缺失或 feasible_incumbent=false：合成验证未通过，交由 sanity 路由（不盲目重跑）
  - 输出目录与 spec 不一致或被其他任务锁定：harness_invariant，必须人工对账
