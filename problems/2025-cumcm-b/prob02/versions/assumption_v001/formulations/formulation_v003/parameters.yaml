# prob02 模型参数（formulation_v003）
# 对应 formulation.md / formula_validation.md；供 implementation/computation 阶段（附件反射率谱反演）使用。
# 单位约定：t[um]、nu[cm^-1]、lambda[um]=1e4/nu、theta[deg]（计算转 rad）、delta_nu[cm^-1]、delta[rad]。
# 本版为 v002 修订：主方法由"全谱幅值 NLS"改为"基线-干涉分解 + 一维相位频率扫描（variable projection）"；
# t 与 n_sub 结构解耦（t 由相位频率确定，n_sub 由干涉幅值弱辨识）；两角一致性改对相位-频率拟合的嵌套 F 检验。
parameters:
  - name: data_inputs
    meaning: 附件 1/2 实测红外反射率谱
    unit: none
    value: null
    domain: "附件1=10°（SiC），附件2=15°（SiC）"
    role: input
    source: data/2025_cumcm_B/附件1.xlsx、附件2.xlsx（题面；B1）
    note: 第 1 列波数 cm^-1，第 2 列反射率 %；第一行表头；约 7469 数据行
  - name: nu_range
    meaning: 实测波数范围
    unit: cm^-1
    value: [399.67, 4000.12]
    domain: "> 0"
    role: domain
    source: 附件实测；B1
    note: 波数升序；附件2 原为降序，反演前重排
  - name: nu_step
    meaning: 波数等间隔网格步长
    unit: cm^-1
    value: 0.482
    domain: "> 0"
    role: domain
    source: 附件实测；B1
    note: 约 0.482；7469 点
  - name: nu_inv
    meaning: 主反演带（色散已知区，截断后）
    unit: cm^-1
    value: [2000.0, 4000.0]
    domain: "nu_lo>=nu_c(2000) 且 <=4000"
    role: domain
    source: B6；L09 Sellmeier 有效区（lambda<=5um）
    note: nu<2000（lambda>5um）为色散缺口区，不进入主反演（w=0）；影响由 delta_t_inv_band 报告
  - name: nu_c
    meaning: Sellmeier 色散模型分界波数
    unit: cm^-1
    value: 2000.0
    domain: "> 0"
    role: domain
    source: L09（经 L11 核验）；A5/B6
    note: 对应 lambda_c=5 um；nu>=nu_c 用 Sellmeier；nu<nu_c 色散已知性不足，主反演剔除
  - name: theta
    meaning: 红外光入射角（空气侧）
    unit: degree
    value: [10.0, 15.0]
    domain: "[0, 90)"
    role: input
    source: 题面；附件 1=10°、附件 2=15°
    note: 两入射角共享同一晶圆片与同一厚度 t（B11）
  - name: n_air
    meaning: 空气折射率
    unit: dimensionless
    value: 1.0
    domain: "≈ 1"
    role: input
    source: 假设 A9/B5（common_sense/inherited）
    note: 误差远小于其他不确定度来源
  - name: n_epi
    meaning: 外延层折射率（色散函数，主反演带内用 Sellmeier）
    unit: dimensionless
    value: null
    domain: "> 1"
    role: model_function
    source: B6；L09 Sellmeier（nu_inv 内）
    formula: "nu in [2000,4000]: n^2=6.79485+0.15558/(lambda^2-0.03535)-0.02296*lambda^2 ; c_disp=1"
    note: 主模型 N-SE（Sellmeier 已知区）；本版 t 由相位频率确定，n 只用于计算相位/周期
  - name: n_sub
    meaning: 衬底折射率（由干涉幅值弱辨识，不参与 t 主反演；解耦）
    unit: dimensionless
    value: null
    domain: "> n（实测约 2.58 vs n≈2.55）"
    role: parameter_to_estimate
    source: B7；L26（4H/6H-SiC n）、L30/L31（掺杂机制）
    note: 弱对比度下 n_sub 弱可辨识（由幅值 A=√(C²+S²) 反演）；t 与 n_sub 解耦，不进入 t 的目标；必要时回退文献取值
  - name: n_sub_init
    meaning: n_sub 估计初值（由幅值反演，非求解器变量）
    unit: dimensionless
    value: 2.58
    domain: "> n"
    role: solver_config
    source: 本版只读实测幅值（§13.2）；L26
    note: 由干涉幅值 A≈0.0040 反演 R_2≈3.2e-5 得到；用于物理正模型 NLS 交叉校验的 n_sub 初值
  - name: t
    meaning: 外延层厚度（待求）
    unit: um
    value: null
    domain: "> 0（主反演扫描区间 [3.0, 20.0]）"
    role: output
    source: 反演目标（B9/B10）
    formula: "t = 1/(2*1e-4*Delta_g)；主反演 t = argmin J(t)（variable projection，(5.7)）"
    note: 主反演输出；由干涉相位频率（一维扫描）唯一确定；本版实测约 7.38（10°）/7.35（15°）
  - name: delta
    meaning: 相邻反射光束相位差（含光程差相位与反射相位跃变）
    unit: rad
    value: null
    domain: 实数
    role: derived
    formula: "delta = 4*pi*1e-4 * n(nu) * t * nu * cos(theta_prime) + phi"
    note: (2.2)；主体为线性于 g=n*nu*cos(theta_prime)，phi 为相位跃变（吸收进 C/S 系数）
  - name: g
    meaning: 相位函数 g(nu)=n(nu)*nu*cos(theta_prime(nu))
    unit: cm^-1
    value: null
    domain: "> 0"
    role: derived
    formula: "g = n*nu*cos(theta_prime)"
    note: 干涉项在 g 空间具有恒定周期 Delta_g=1/(2*1e-4*t)；本版以 g 空间频率/周期确定 t
  - name: Delta_g
    meaning: 干涉项在 g 空间的周期（对应厚度 t 的相位频率观测量）
    unit: cm^-1
    value: null
    domain: "> 0"
    role: derived_observable
    formula: "Delta_g = 1/(2*1e-4*t)  <=>  t = 1/(2*1e-4*Delta_g)"
    note: (5.9)；主反演由 J(t) 扫描直接求 t，不必显式提取 Delta_g；Delta_g 用于周期图初值核实
  - name: delta_nu
    meaning: 相邻干涉极值（峰或谷）的波数间隔
    unit: cm^-1
    value: null
    domain: "> 0"
    role: derived_observable
    formula: "delta_nu = 1e4 / (2*n*cos(theta_prime)*t)"
    note: 带内 t≈7.4 对应约 266 cm^-1；本版不再以个别极值间隔作为主判据（M2/M3 交叉验证）
  - name: delta_t_amb
    meaning: 厚度周期歧义周期（随参考波数变化）
    unit: um
    value: null
    domain: "> 0"
    role: derived
    formula: "delta_t_amb = 1 / (2*1e-4*n(nu0)*nu0*cos(theta_prime(nu0)))"
    note: (6.3)；nu0=2000~1.0um、3000~0.65um、4000~0.49um；色散（g 随 nu 变化）打破周期等价，扫描可区分
  - name: R_1
    meaning: 空气/外延层界面强度反射率（依赖 n(nu)，本版用于物理正模型校验）
    unit: dimensionless
    value: null
    domain: "[0, 1)"
    role: derived
    source: Fresnel（L06/L07，prob01 3.1-3.3）；prob03 登记 R_01 前置
    note: s/p 偏振平均；主方法中作基线 B 的一部分由多项式吸收
  - name: R_2
    meaning: 外延层/衬底界面强度反射率（由幅值 A 反演，弱辨识）
    unit: dimensionless
    value: null
    domain: "[0, 1)"
    role: derived
    source: Fresnel（L06/L07）；由 A=√(C²+S²)=2(1-R_1)√(R_1 R_2) 反演
    note: 带内弱（R_2≈3e-5），n_sub 弱可辨识；不影响 t（相位频率确定）
  - name: baseline_poly_deg
    meaning: 基线 B(nu) 多项式阶数 p（吸收 DC 基线及其色散趋势）
    unit: none
    value: 3
    domain: "[1, 6]（默认 3，计算前固定）"
    role: solver_config
    source: 本版 §5.5/§13.2 阶数敏感性
    note: p=1..6 下 t∈[7.38,7.40] 稳健；防止过度吸收干涉，用留出/残差谱周期检查
  - name: envelope_poly_deg
    meaning: 干涉包络 C/S 多项式阶数 q
    unit: none
    value: 1
    domain: "[0, 2]（默认 1，计算前固定）"
    role: solver_config
    source: 本版 §5.5
    note: C/S 吸收 A*cos(phi) 与 A*sin(phi) 的缓变；q 过大可能过拟合
  - name: t_scan_range
    meaning: 主反演一维扫描区间
    unit: um
    value: [3.0, 20.0]
    domain: "> 0；须覆盖周期图主峰（约 7.5）与相邻周期歧义"
    role: solver_config
    source: 本版 §13.3 周期图 + Δt_amb；B8/B9
    note: 先由 g 空间周期图粗估主峰，再取 [主峰-3*Δt_amb, 主峰+3*Δt_amb] 并落到 [t_lo,t_hi]
  - name: t_scan_step
    meaning: 主反演一维扫描步长（后抛物线精化）
    unit: um
    value: 0.01
    domain: "> 0"
    role: solver_config
    source: 本版 §6.2
    note: 步长 <=0.01 保证全局极小捕获与唯一性判定分辨率
  - name: dispersion_model
    meaning: 主反演色散模型选择
    unit: none
    value: N-SE
    domain: "[N-SE, N-SE-delta, N-const]"
    role: team_decision
    source: B6；L09 Sellmeier；沿用 v002
    note: N-SE=带内 Sellmeier（主）；N-SE-delta=Sellmeier×c_disp（灵敏度）；N-const=常数 n 基线（B10 对照，不入 delta_t_disp 候选集）
  - name: c_disp
    meaning: 色散标定因子（带内 Sellmeier 系数可复现性）
    unit: dimensionless
    value: 1.0
    domain: "[0.995, 1.005]（delta=0.5%）"
    role: parameter_to_estimate
    source: B6；L09 经 L11 交叉核验
    note: 主模型取 1；N-SE-delta 模型扰动作灵敏度（§7.2）
  - name: delta_c_disp
    meaning: 色散敏感性扰动半宽（带内 Sellmeier 系数可复现性）
    unit: none
    value: 0.005
    domain: "> 0"
    role: team_decision
    source: L09/L11（Sellmeier 系数可复现性）；沿用 v002
    note: N-SE-delta 用 c_disp∈[1±0.005]；delta_t_disp 对该族统计（本版实测约 1.0%）
  - name: inversion_method
    meaning: 主反演方法
    unit: none
    value: variable_projection_periodicity
    domain: "[variable_projection_periodicity, full_spectrum_nls, extremum_phase, constant_n_baseline, airy_correction]"
    role: team_decision
    source: 本版 §5/§6（B8-B10）；L25/L32；薄膜干涉标准频率法
    note: M1 主=variable projection（基线-干涉分解 + 一维扫描）；M1-P1 物理正模型 NLS 交叉校验；M2 色散相位法/周期图初值；M3 常数 n 基线；M4 多光束诊断（B13）
  - name: mode
    meaning: t 与 n_sub 的解耦模式
    unit: none
    value: frequency_decoupled
    domain: "[frequency_decoupled, joint_P2, P1]"
    role: team_decision
    source: 本版 §5.3（B7/B9/B10）
    note: 本版主模式=频率解耦：t 由相位频率确定，n_sub 由幅值事后弱辨识（不进入 t 的目标）；joint_P2/P1 仅作物理正模型交叉校验
  - name: target_tolerance
    meaning: 线性 LS 残差/扫描收敛容差
    unit: none
    value: 1e-10
    domain: "> 0"
    role: solver_config
    source: 本项目惯例；prob01 task_config
    note: 用于线性 LS 的 rcond/精度与抛物线精化
  - name: tau_12
    meaning: 两入射角一致性裸偏差报告阈值（B11）
    unit: percent
    value: 2.0
    domain: "> 0"
    role: reliability_gate
    source: B11；team_decision（§7.1）
    note: 主判据为嵌套 F 检验（alpha=0.05）；tau_12 作为裸偏差报告/解释阈值（本版实测 ε12≈0.35%）
  - name: alpha_ftest
    meaning: 两角一致性嵌套 F 检验显著性水平
    unit: none
    value: 0.05
    domain: "(0,1)"
    role: reliability_gate
    source: 统计学标准（§7.1）
    note: F<=F_alpha(1,N_tot-3) 接受共享 t（一致性 PASS）
  - name: tau_disp
    meaning: 色散模型敏感性阈值（B6，带内合法候选）
    unit: percent
    value: 2.0
    domain: "> 0"
    role: reliability_gate
    source: B6；prob01 robustness E3（§7.2）
    note: delta_t_disp<=tau_disp（N-SE vs N-SE-delta，delta_c_disp=0.5%；本版实测约 1.0%）
  - name: tau_ci
    meaning: 厚度 95% CI 半宽阈值（B12）
    unit: percent
    value: 2.0
    domain: "> 0"
    role: reliability_gate
    source: B12；SSE(t) 曲率/轮廓似然或 bootstrap B>=200（§7.4）
    note: CI 半宽<=tau_ci
  - name: tau_nsub_diag
    meaning: n_sub 灵敏度诊断阈值（B7，因解耦预期接近 0）
    unit: percent
    value: 3.0
    domain: "> 0"
    role: reliability_diagnostic
    source: B7；本版 §7.3
    note: t 与 n_sub 解耦后，n_sub 变化对 t 的影响应接近 0；该值为诊断上限，观察解耦是否成立
  - name: tau_anom
    meaning: 异常点处理对厚度影响阈值（B2）
    unit: percent
    value: 1.0
    domain: "> 0"
    role: reliability_gate
    source: B2（§7.5）
    note: delta_t_anom<=tau_anom
  - name: multibeam_threshold
    meaning: 多光束需修正的残差改善阈值（B13）
    unit: percent
    value: 10.0
    domain: "> 0"
    role: reliability_gate
    source: B13（§7.6）
    note: Airy 相对两光束残差改善 >10% 则标志需多光束修正；否则两光束适用（v001/v002 实测 <10%）
  - name: reststrahlen_exclude
    meaning: 近 Reststrahlen 区（两光束无吸收模型不适用）
    unit: cm^-1
    value: [700, 1000]
    domain: "> 0"
    role: domain
    source: B3；L16/L26
    note: 预处理权重 w=0；与 nu_inv 截断共同限定反演带
  - name: anomaly_rule
    meaning: 附件 2 反射率 >100% 的异常点判定与处理
    unit: none
    value: null
    domain: "R%>100（或上分位 Q99.9）"
    role: team_decision
    source: B2；L25/L32
    note: 判定为测量/标定异常；剔除/截断/降权三策略，记录 S_A，不修改原始数据（§3.2/§7.5）
  - name: weight_anomaly
    meaning: 异常点权重
    unit: none
    value: 0.05
    domain: "[0,1]"
    role: solver_config
    source: v001 实现；B2（(3.2) 降权）
    note: 附件 2 超 100% 点按此降权；若对 t 影响超 tau_anom=1% 则复核策略
  - name: comparison_criteria
    meaning: 模型比较标准（计算结果前固定）
    unit: none
    value: null
    domain: null
    role: team_decision
    source: 本版本 §8.2
    note: 约束满足度、题目指标、解释性、复杂度、运行预算、鲁棒性
  - name: seed
    meaning: 随机种子（bootstrap/MC、求解扰动）
    unit: none
    value: 20260829
    domain: "> 0"
    role: solver_config
    source: 本项目惯例（AUTOMM_SEED 优先）
    note: 保证可复现；prob02 与 prob01 一致
