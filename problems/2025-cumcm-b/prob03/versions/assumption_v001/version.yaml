assumptions:
- id: C1
  statement: 平面平行板多次反射-透射的反射强度服从 Airy 公式，以界面强度反射率 R_01（空气/外延层）、R_12（外延层/衬底）与相邻束相位差
    δ 表示；当 R_01·R_12 → 0 时无穷级数退化为两光束叠加 I = I1 + I2 + 2√(I1·I2)·cos δ
  type: mechanism_simplification
  key: true
  evidence_type: literature_fact
  reference_ids:
  - L06
  - L07
  - L43
  scope: 外延层-衬底双层结构；硅片(附件3/4)与SiC(附件1/2)；复振幅采用复 Fresnel 系数 r_01/r_12
  bias_direction: 若真实 R_01·R_12 不可忽略而采用两光束模型，会低估条纹对比度并引入拟合残差/厚度偏差（C13 量化）
  verification: Airy 正模型与两光束模型对附件3/4的全谱拟合残差、峰形与条纹对比度比较
  related_assumptions:
  - C2
  - C4
  - C5
  - C13
  - C16
  status: candidate
- id: C2
  statement: 多光束显著性与界面反射率乘积 R_01·R_12 及条纹精细度 F = π√R̄/(1−R̄) 相关；"两光束近似 vs 多光束显著"以
    R_01·R_12 是否低于阈值量化（两光束残差约0.2%、R_01·R_12~1e-3 时可近似两光束）；阈值由物理推导（Fresnel 按 n/n_sub/θ）与数据判定共同确定并登记
  type: boundary_assumption
  key: true
  evidence_type: literature_fact
  reference_ids:
  - L47
  - L43
  scope: 硅片与 SiC 分别评估；透明谱段
  bias_direction: 若 R_01·R_12 相对高而误用两光束，将低估多光束修正需求
  verification: Fresnel 公式计算 R_01/R_12；条纹对比度与峰形核验
  related_assumptions:
  - C1
  - C3
  - C4
  - C5
  - C11
  status: candidate
- id: C3
  statement: 严格多光束干涉要求两界面近似平行（平行板）；界面呈楔形或不平度使子孔径相位不一致、高次干涉被平均/抵消，退化为两光束或对比度下降；附件3/4硅片需评估界面平行度
  type: boundary_assumption
  key: false
  evidence_type: literature_fact
  reference_ids:
  - L46
  scope: 硅外延层宏观平整度
  bias_direction: 界面不平行 → 高次干涉被抑制、多光束被误判为不显著
  verification: 条纹对比度随波数/位置变化；Airy 峰形对称性
  related_assumptions:
  - C1
  - C2
  - C5
  - C9
  status: candidate
- id: C4
  statement: 多光束各阶反射光程差为 2m·n·t·cosθ′（m=1,2,…），须光源相干长度 L_c ≥ 最高阶光程差；FTIR 的 L_c 由光谱分辨率
    Δν 决定（量级 L_c≈1/(2Δν)），可维持干涉级次上限 m_max 受相干长度约束
  type: boundary_assumption
  key: true
  evidence_type: literature_fact
  reference_ids:
  - L06
  - L07
  scope: 附件3/4硅外延层；FTIR 分辨率决定 L_c
  bias_direction: 相干长度不足 → 高次干涉被洗掉、实际等效两光束
  verification: 由光谱分辨率估计 L_c 并与最大光程差比较；多光束模型预测与实测峰形对照
  related_assumptions:
  - C1
  - C2
  - C5
  - C16
  status: inherited
- id: C5
  statement: 外延层/衬底消光系数 k 使高次反射衰减、削减有效干涉级次；吸收越强越抑制多光束；硅在中红外透明区 k 很小、多光束相对更易出现；SiC
    近 Reststrahlen 区(约700-1000 cm^-1)吸收/色散强、多光束被抑制
  type: boundary_assumption
  key: true
