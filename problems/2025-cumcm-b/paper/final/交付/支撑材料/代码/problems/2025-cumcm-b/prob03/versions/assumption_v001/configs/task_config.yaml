# prob03 计算任务执行配置（computation 阶段由 supervised worker 执行）
# 场景与执行设置：硅片（附件3/4）多光束判定 + 厚度反演；SiC（附件1/2）重新判定（prob02 对照）。
# 分层合并：本文件作为 make_task_spec 的 config_path 合并进有效配置（compute 段生效）。
# 版本：formulation_v002（主反演 = 基线-干涉分解 + 一维相位频率扫描（variable projection），两角共享 t；
#       t 与 n_sub 解耦；多光束必要条件 N1–N4 + η_mb 判据；SiC 仅重新判定）。
# v002 较 v001：硅厚度基准更正为 t̂≈3.4477 µm（R1）；finesse 统一为 π√R̄/(1−R̄)（R2），代码已对应修正。
compute:
  task_timeout_seconds: 1200
  memory_per_worker_gb: 2
scenario:
  # 实测数据：硅片（附件3/4，主反演）+ SiC（附件1/2，Q3 重新判定）
  attachment_si10: data/2025_cumcm_B/附件3.xlsx   # 硅，入射角 10°
  attachment_si15: data/2025_cumcm_B/附件4.xlsx   # 硅，入射角 15°
  attachment_sic10: data/2025_cumcm_B/附件1.xlsx  # SiC，入射角 10°（Q3 重新判定）
  attachment_sic15: data/2025_cumcm_B/附件2.xlsx  # SiC，入射角 15°（Q3 重新判定）
  theta_deg: [10.0, 15.0]
  dispersion_model: N-SE            # 硅主模型（C7/C8）：Sellmeier（L12/L13），主带内纯 Sellmeier
  sic_t_ref_um: 7.2158              # prob02 对照（prob02-conclusion-v1，C17）
  seed: 20260830                    # 随机种子（可复现；AUTOMM_SEED 优先）
  inversion:
    inv_band_lo: 2000.0             # 硅主反演谱段下界 ν_inv（C8，透明窗）
    inv_band_hi: 4000.0             # 硅主反演谱段上界 ν_inv（实测上界）
    t_scan_lo: 2.0                  # 一维扫描下界（parameters.yaml t_scan_range）
    t_scan_hi: 12.0                 # 一维扫描上界（覆盖周期图主峰约 6.9 与半周期歧义 3.55）
    t_scan_step: 0.01               # 扫描步长（≤0.01µm，全局极小捕获与唯一性分辨率）
    baseline_poly_deg: 3            # B(ν) 基线多项式阶数 p（§6.1，默认 3，计算前固定）
    envelope_poly_deg: 1            # C(ν)/S(ν) 包络多项式阶数 q（§6.1，默认 1，计算前固定）
    weight_anomaly: 0.05            # 异常点降权权重（B2，§4.3；硅片无 R%>100 异常）
  reliability:
    tau_12: 2.0                     # 两角一致性裸偏差报告/解释阈值（主判据为嵌套 F 检验 alpha_ftest）
    alpha_ftest: 0.05               # 嵌套 F 检验显著性水平（§7.2）
    tau_disp: 2.0                   # 带内色散模型敏感性阈值 N-SE vs N-SE-delta（§7.2）
    delta_c_disp: 0.005             # Sellmeier 系数可复现性扰动半宽（N-SE-delta，c_disp=1±0.5%）
    tau_ci: 2.0                     # 95% CI 半宽阈值（§7.5，轮廓似然由 J(t) 曲线）
    tau_nsub_diag: 3.0              # n_sub 灵敏度诊断阈值（§6.4，解耦诊断非硬门禁）
    tau_anom: 1.0                   # 异常点影响（B2，§4.3）
    theta_mb: 0.05                  # 多光束必要条件 N1：Rbar=sqrt(R01*R12) 阈值（§3.1/§3.6）
    tau_mb: 10.0                    # 主判据：Airy vs 两光束残差改善率阈值（§7.2），>τ_mb 则需多光束修正
