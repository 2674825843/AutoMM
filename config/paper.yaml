enabled: true
source_format: markdown
primary_output: docx
outputs: [docx, pdf, tex]
reference_doc: 数模论文标准模板.docx
style_map:
  title: Title
  heading1: heading 1
  heading2: heading 2
  heading3: heading 3
  body: Normal
  image: 图片
  figure_caption: 图注
  table_caption: 表注
  table: 三线表
  table_text: 表格
  display_math: 行间公式辅助样式
  bibliography: 参考文献
  ordered_list: 有序列表
  unordered_list: 无序列表
  code: Plain Text
output_root_template: reports/problems/{problem_id}/paper
require_cross_question_review: true
require_level_5: true
require_all_figures_reviewed: true
max_writer_revisions: 3
minimum_pdf_pages: 12
pandoc_executable: pandoc
pdf_exporter: microsoft_word
pdf_export_timeout_seconds: 120
